[package]
name = "agile"
version = "0.1.0"
edition = "2021"
description = "CLI agile tools for small teams, designed for AI agent interaction"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
colored = "2"
thiserror = "1"
